name: Hourly site refresh

# Keeps the ISR cache warm: Next.js regenerates a page in the background on the
# first request after its revalidate window, so we hit each page twice with a
# pause — the first request triggers regeneration, the second serves it hot.
# Result: visitors always see data at most ~1h old even with zero traffic.

on:
  schedule:
    - cron: '7 * * * *' # hourly at :07 (offset to avoid the top-of-hour herd)
  workflow_dispatch: {}

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger regeneration
        run: |
          set -euo pipefail
          for path in "/" "/intel"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -m 60 "https://dailystock-cyan.vercel.app${path}")
            echo "warm-1 ${path} -> ${code}"
            [ "$code" = "200" ]
          done
      - name: Wait for background regeneration
        run: sleep 20
      - name: Confirm fresh cache
        run: |
          set -euo pipefail
          for path in "/" "/intel"; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" -m 60 "https://dailystock-cyan.vercel.app${path}")
            echo "warm-2 ${path} -> ${code}"
            [ "$code" = "200" ]
          done
