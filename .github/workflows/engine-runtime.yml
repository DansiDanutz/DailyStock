name: Engine runtime contract

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  supported-python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python daily_stock_analysis/scripts/check_python_runtime.py

  reject-python-314:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Require the unsupported-runtime exit code
        run: |
          set +e
          python daily_stock_analysis/scripts/check_python_runtime.py
          result=$?
          set -e
          test "$result" -eq 2
